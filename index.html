<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PASS OFF Builder</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f6f8fb;
  padding: 20px;
}

h2 {
  margin-top: 30px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th {
  background: #f1f5f9;
  color: #0f172a;
  border: 1px solid #e5e7eb;
  padding: 8px;
  text-align: left;
}

td {
  border: 1px solid #e5e7eb;
  padding: 8px;
}

input {
  width: 100%;
  padding: 5px;
}

button {
  margin-top: 10px;
  padding: 8px 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>PASS OFF BUILDER</h1>

<h2>General Information</h2>
<input placeholder="Assigned Line"><br><br>
<input placeholder="Assignment Date"><br><br>
<input placeholder="Product Item"><br><br>
<input placeholder="Total Pallets"><br>

<h2>Adjustments</h2>
<table id="adjTable">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>LPN</th>
<th>Reason</th>
</tr>
</thead>
<tbody></tbody>
</table>
<button onclick="addRow('adjTable')">Add Adjustment</button>

<h2>Scrap</h2>
<table id="scrapTable">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>LPN</th>
<th>Reason</th>
</tr>
</thead>
<tbody></tbody>
</table>
<button onclick="addRow('scrapTable')">Add Scrap</button>

<h2>Movements</h2>
<table id="movTable">
<thead>
<tr>
<th>Item</th>
<th>LPN</th>
<th>From</th>
<th>To</th>
<th>Reason</th>
</tr>
</thead>
<tbody></tbody>
</table>
<button onclick="addRow('movTable',5)">Add Movement</button>

<h2>Cycle Count</h2>
<table id="cycleTable">
<thead>
<tr>
<th>Item</th>
<th>LPN</th>
<th>Found (YES/NO)</th>
<th>Detail</th>
</tr>
</thead>
<tbody></tbody>
</table>
<button onclick="addRow('cycleTable',4)">Add Cycle</button>

<br><br>

<button onclick="exportHTML()">Export for Email</button>

<script>

function addRow(tableId, cols = 4){
  let table = document.getElementById(tableId).querySelector("tbody");
  let row = document.createElement("tr");

  for(let i=0;i<cols;i++){
    let td = document.createElement("td");
    td.innerHTML = "<input>";
    row.appendChild(td);
  }

  table.appendChild(row);
}

function exportHTML(){
  let content = document.body.innerHTML;

  let win = window.open("");
  win.document.write(`
    <html>
    <body style="font-family:Arial;">
    ${content}
    </body>
    </html>
  `);
}

</script>

</body>
</html>
